:root{
  --f-ui:"Jost","Futura","Century Gothic",sans-serif;
  --panel:#141a2e; --line:#2a3458; --ink:#f3f5fb; --ink-dim:#97a1c4; --pink:#e0466f; --gold:#f6a32f;
}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{font-family:var(--f-ui);color:var(--ink)}
#stage{position:absolute;inset:0}
svg.asset{width:100%;height:100%;display:block;overflow:visible}
/* opened outside OBS: show it on a menu-like backdrop with settings open */
body.preview{background:radial-gradient(120% 90% at 50% 0%,#2c4384 0%,#1d2c5e 45%,#121a36 100%);overflow:auto}
body.preview #stage{position:relative;inset:auto;max-width:740px;margin:32px auto 0;padding:0 16px;aspect-ratio:740/290}
body.preview.tab #stage{aspect-ratio:440/135;max-width:440px}

/* SVG parts */
.t{font-family:var(--f-ui); font-weight:700; fill:#fff}
.btn{cursor:pointer}
.btn .face{transition:fill .12s, transform .12s}
.btn:hover .face{fill:#ffffff}
.btn:active{transform:translateY(2px)}
.btn:focus{outline:none}
.btn:focus-visible .face{stroke:var(--gold); stroke-width:3}
/* A continuous white band joins two smooth, wider arc sections. */
.orbit{animation:orbit 1.7s linear infinite;transform-origin:370px 40px}
@keyframes orbit{to{transform:rotate(360deg)}}
/* One short sonar pair, then a quiet interval. Shared timing keeps edge reflections
   attached to the wave crossing the surface, rather than a global brightness flash. */
.sonar{pointer-events:none}
.sonar-wave{transform-origin:370px 40px;animation:sonar 3s linear infinite;opacity:0}
.sonar-wave.echo{animation-delay:.32s}
.sonar-surface{opacity:.18}
.sonar-reflection{opacity:.48}
@keyframes sonar{
  0%{transform:scale(1);opacity:0}
  5%{opacity:1}
  33%{opacity:.65}
  46%{transform:scale(7.1);opacity:0}
  100%{transform:scale(7.1);opacity:0}
}
.halo{opacity:.54}
.frame-echo{transform-origin:370px 40px;animation:frameEcho 3s ease-out infinite;opacity:0}
@keyframes frameEcho{
  0%,25%{transform:scale(1);opacity:0}
  30%{opacity:.22}
  49%{transform:scale(1.035,1.09);opacity:0}
  100%{transform:scale(1.035,1.09);opacity:0}
}

/* Button hover highlights remain independent of the queue pulse. */
.btn-sheen{opacity:0; transition:opacity .2s}
.btn:hover .btn-sheen{opacity:1}
.btn:hover .btn-sheen rect{animation:btnsheen .7s cubic-bezier(.45,.05,.25,1) both}
@keyframes btnsheen{from{transform:translateX(-120px)}to{transform:translateX(320px)}}
.timer-in{animation:tick .35s ease-out}
@keyframes tick{0%{opacity:.78}100%{opacity:1}}
.reset-flash{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.2}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.orbit,.sonar-wave,.frame-echo,.timer-in,.reset-flash{animation:none}.sonar-wave,.frame-echo{opacity:0}}


/* settings drawer */
#settings{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));
  box-sizing:border-box;background:rgba(20,26,46,.97);border:1px solid var(--line);border-radius:6px;padding:14px 16px;
  display:grid;gap:12px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:5}
body.preview #settings{position:relative;left:auto;bottom:auto;transform:none;margin:24px auto 32px}
#settings[hidden]{display:none}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.lbl{width:96px;flex:none;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.go{font:600 14px/1 var(--f-ui);color:var(--ink);background:#1f2742;border:1px solid var(--line);padding:8px 12px;cursor:pointer;
  font-variant-numeric:tabular-nums;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.seg button:hover,.go:hover{background:#28335a}
.seg button[aria-pressed="true"]{background:var(--pink);border-color:var(--pink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#elapsedIn{font:600 15px/1 var(--f-ui);font-variant-numeric:tabular-nums;color:var(--ink);background:#0d1222;border:1px solid var(--line);
  border-radius:3px;padding:8px 10px;width:110px}
#elapsedIn.bad{border-color:#ff6b7d}
.hint{font-size:12px;color:var(--ink-dim)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-dim)}
.foot kbd{font:600 11px var(--f-ui);border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--ink)}
</style>
</head>
<body>
<div id="stage">
<svg class="asset" preserveAspectRatio="xMidYMin meet" id="asset" viewBox="0 -10 740 290" role="img" aria-label="Competitive queue searching indicator">
  <defs>
    <linearGradient id="tabFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2335a"/><stop offset=".55" stop-color="#d33f68"/><stop offset="1" stop-color="#e14c75"/>
    </linearGradient>
    <linearGradient id="tabSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20263c" stop-opacity=".96"/><stop offset="1" stop-color="#151a2a" stop-opacity=".97"/>

  <div class="foot"><span>Press <kbd>S</kbd> or double-click the badge to hide</span><span id="sizeHint"></span></div>
</aside>

<script>
(() => {
  const KEY = 'searching-overlay:v1';
  const inOBS = !!window.obsstudio;
  const $ = id => document.getElementById(id);
  const svg = document.querySelector('svg.asset'), timerEl = $('timer'), panel = $('panel'), settings = $('settings');

  // ---- state: wall-clock anchored so reloads, scene switches and OBS restarts keep counting
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} };
  let st = load() || { base: 0, at: Date.now(), speed: 1, layout: 'full', param: null };

  const parseTime = str => {
    const p = String(str).trim().split(':');
    if (!p[0] || p.length > 3 || p.some(x => !/^\d+$/.test(x))) return null;
    const n = p.map(Number);
    if (n.length === 1) return n[0] * 60;
    if (n.length === 2) return n[1] < 60 ? n[0] * 60 + n[1] : null;
    return n[1] < 60 && n[2] < 60 ? n[0] * 3600 + n[1] * 60 + n[2] : null;
  };
  const fmt = s => {
    s = Math.max(0, Math.floor(s));
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = String(s % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
  };
  const elapsed = () => st.base + (Date.now() - st.at) / 1000 * st.speed;

  // URL params (OBS URL mode). t only re-anchors when its value changes, so reloads don't reset the clock.
  const q = new URLSearchParams(location.search);
  if (q.has('layout') && /^(full|tab)$/.test(q.get('layout'))) st.layout = q.get('layout');
  if (q.has('speed') && +q.get('speed') >= 1) { st.base = elapsed(); st.at = Date.now(); st.speed = +q.get('speed'); }
  if (q.has('t') && q.get('t') !== st.param) {
    const sec = parseTime(q.get('t'));
    if (sec !== null) { st.base = sec; st.at = Date.now(); st.param = q.get('t'); }
  }
  save();

  function setElapsed(sec) {
    st.base = sec; st.at = Date.now(); save(); sync();
    timerEl.classList.remove('reset-flash'); void timerEl.getBBox(); timerEl.classList.add('reset-flash');
  }

  function applyLayout() {
    const tab = st.layout === 'tab';
    panel.style.display = tab ? 'none' : '';
    svg.setAttribute('viewBox', tab ? '150 -10 440 135' : '0 -10 740 290');
    document.body.classList.toggle('tab', tab);
    $('sizeHint').textContent = 'OBS source size: ' + (tab ? '880 \u00d7 270' : '1480 \u00d7 580');
  }
  function sync() {
    document.querySelectorAll('#segStart button').forEach(b => b.setAttribute('aria-pressed', 'false'));
    document.querySelectorAll('#segSpeed button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.x === st.speed)));
    document.querySelectorAll('#segLayout button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === st.layout)));
    applyLayout();
  }

  $('segStart').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setElapsed(+b.dataset.s); });
  $('segSpeed').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    st.base = elapsed(); st.at = Date.now(); st.speed = +b.dataset.x; save(); sync();
  });
  $('segLayout').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { st.layout = b.dataset.l; save(); sync(); } });

  const entryIn = $('elapsedIn'), hint = $('entryHint');
  $('entry').addEventListener('submit', e => {
    e.preventDefault();
    const sec = parseTime(entryIn.value);
    if (sec === null) { entryIn.classList.add('bad'); hint.textContent = 'Use m:ss or h:mm:ss, e.g. 38:20'; return; }
    entryIn.classList.remove('bad'); hint.textContent = 'Set to ' + fmt(sec); setElapsed(sec);
  });
  entryIn.addEventListener('input', () => { entryIn.classList.remove('bad'); hint.textContent = 'm:ss or h:mm:ss'; });

  // CANCEL resets; CHANGE ROLE is decorative
  const btnCancel = $('btnCancel');
  btnCancel.addEventListener('click', () => setElapsed(0));
  btnCancel.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setElapsed(0); } });

  // settings toggle: S key or double-click the badge (OBS: right-click source > Interact)
  const toggle = () => { settings.hidden = !settings.hidden; };
  document.addEventListener('keydown', e => { if ((e.key === 's' || e.key === 'S') && e.target !== entryIn) toggle(); });
  $('emblem').addEventListener('dblclick', toggle);

  // other tabs/windows of the same file stay in step
  window.addEventListener('storage', e => { if (e.key === KEY) { const n = load(); if (n) { st = n; sync(); } } });

  if (!inOBS) { document.body.classList.add('preview'); settings.hidden = false; }

  let last = '';
  (function frame() {
    const t = fmt(elapsed());
    if (t !== last) { timerEl.textContent = t; last = t; }
    requestAnimationFrame(frame);
  })();
  sync();
})();
</script>
</body>
</html>
